name: Headless regression tests

on:
  push:
    branches:
      - main
      - feature/phase1-qt-readonly-shell
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Diagnose Python and Qt environment
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python --version
          python -m pip show PySide6 Pillow
          python -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt offscreen platform:', app.platformName())"
      - name: Run headless regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        # Discovery picks up every test_*.py, so new test modules are never left out of CI.
        run: python run_headless_tests.py
