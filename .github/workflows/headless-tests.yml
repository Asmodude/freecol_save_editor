name: Headless regression tests

on:
  push:
    branches:
      - main
      - refactor/phase0-core-extraction
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Run headless regression suite
        # Discovery picks up every test_*.py, so new test modules are never left out of CI.
        run: python -m unittest discover -v -p 'test_*.py'
