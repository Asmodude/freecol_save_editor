name: Headless regression tests

on:
  push:
    branches:
      - main
      - feature/phase1-qt-readonly-shell
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check Pillow PySide6
      - name: Run headless regression suite
        env:
          QT_QPA_PLATFORM: offscreen
        # Discovery picks up every test_*.py, so new test modules are never left out of CI.
        run: python -m unittest discover -v -p 'test_*.py'
